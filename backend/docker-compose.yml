services:
  ipfs:
    image: ipfs/kubo:latest
    ports: # for ipfs:
      - "4001:4001" # swarm
      - "5001:5001" # api
      - "8080:8080" # gateway
    volumes:
      - ipfs_data:/data/ipfs

  cluster:
    image: ipfs/ipfs-cluster:latest
    depends_on:
      - ipfs
    environment:
      - CLUSTER_PEERNAME=qos-cluster
      - CLUSTER_SECRET=2b404ed3781f8f7c5e5ba6443c68383c27e5bc41b44b815dd31bb43878b30e01
      - CLUSTER_IPFSHTTP_NODEMULTIADDRESS=/dns4/ipfs/tcp/5001
      - CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS=/ip4/0.0.0.0/tcp/9094
    ports:
      - "9094:9094" 
      - "9096:9096"
    volumes:
      - cluster_data:/data/ipfs-cluster

volumes:
  ipfs_data:
  cluster_data: